<!-- GUIDE V2 LAYER (owner + senior-SME approved, 2026-10-05). Layer-owned, additive; the sim's own code is untouched.
     Blackboard start board (title, one line, two choices; the sim waits) · Guide me: a 4–6 step Simulation guide
     (2–3 scene steps, then controls; the last card points at Play, or at trigger.at in static sims; voice on every
     card) · Explore freely: ONE trigger hint at one control that closes itself within 3 s · the Physics sheet gets
     its "In one line" summary block at the top. Per-sim content lives in window.__GV_SPEC (see SPEC_FORMAT.md). -->
<style id="gv-style">
__FONTS__
#gv-start,#gv-tour,#gv-free,#gv-playtip,#gv-hint{--chalk:#f7f5ee;--chalk2:#e6e3d8;--chalk3:#b3bdb6;--yellow:#fbe38a;--board:#22372f;--board2:#1a2d26;
  --wood:#8d5b33;--wood-hi:#a8713f;--wood2:#5a381d;
  --hand:'Kalam','Chalkboard SE','Segoe Print','Bradley Hand',cursive;
  --print:'Patrick Hand','Chalkboard SE','Segoe Print','Comic Sans MS',cursive;}
.gv-board{position:relative;color:var(--chalk);font-family:var(--print);border-radius:5px;text-align:left;
  background:radial-gradient(ellipse 60% 40% at 18% 8%,rgba(255,255,255,.045),transparent 70%),
    radial-gradient(ellipse 50% 30% at 90% 100%,rgba(255,255,255,.05),transparent 70%),
    linear-gradient(165deg,var(--board),var(--board2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 24px rgba(0,0,0,.4),
    0 0 0 3px var(--wood-hi),0 0 0 7px var(--wood),0 0 0 9px var(--wood2),0 18px 40px rgba(0,0,0,.5);
  -webkit-font-smoothing:antialiased;letter-spacing:normal;line-height:normal;}
.gv-board::before{content:"";position:absolute;inset:-7px;pointer-events:none;border:4px solid transparent;
  border-image:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 1px,transparent 1px 4px,rgba(255,255,255,.06) 4px 5px,transparent 5px 9px) 4;}
.gv-board b{font-weight:400;color:#fff;}
.gv-hand{border:1.6px solid rgba(247,245,238,.62);border-radius:255px 12px 225px 12px/12px 225px 12px 255px;}
.gv-write{display:inline-block;clip-path:inset(-4px 100% -6px 0);animation:gvWrite .55s cubic-bezier(.35,.1,.3,1) forwards;}
@keyframes gvWrite{to{clip-path:inset(-4px -4px -6px 0);}}
.gv-w{opacity:0;display:inline-block;transform:translateY(3px);animation:gvWord .28s ease-out forwards;}
@keyframes gvWord{to{opacity:1;transform:none;}}
.gv-underline{display:block;width:100%;height:8px;}
.gv-underline path{fill:none;stroke:var(--yellow);stroke-width:2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:gvDraw .45s .45s ease-out forwards;opacity:.85;}
@keyframes gvDraw{to{stroke-dashoffset:0;}}
.gv-erasing .gv-body,.gv-erasing .gv-head .gv-chap{animation:gvErase .18s ease-in forwards;}
@keyframes gvErase{to{opacity:0;transform:translateX(10px);filter:blur(1px);}}
.gv-textbtn{font:inherit;color:var(--chalk2);background:none;border:0;cursor:pointer;padding:2px 4px;text-decoration:underline dotted;text-underline-offset:4px;}
.gv-textbtn:hover{color:#fff;}
.gv-cbtn{font:18px/1 var(--print);color:var(--chalk);background:transparent;cursor:pointer;padding:6px 12px 5px;white-space:nowrap;transition:background .15s,transform .15s;}
.gv-cbtn:hover{background:rgba(255,255,255,.07);transform:translateY(-1px);}
.gv-cbtn:disabled{opacity:.3;cursor:default;transform:none;}
.gv-cbtn.primary{color:#1e2320;background:var(--yellow);border-color:var(--yellow);}
.gv-cbtn.primary:hover{background:#fff0b8;}

/* ---------- start board ---------- */
#gv-start{position:fixed;inset:0;z-index:5600;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse at 50% 45%,rgba(4,8,12,.45),rgba(4,8,12,.72));backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
#gv-start[hidden]{display:none;}
#gv-start .gv-board{box-sizing:border-box;width:min(500px,100%);padding:30px 32px 36px;text-align:center;animation:gvIn .4s cubic-bezier(.2,.8,.2,1);}
@keyframes gvIn{from{opacity:0;transform:translateY(12px) scale(.985);}to{opacity:1;transform:none;}}
.gv-kicker{margin:0;font:18px var(--print);color:var(--chalk3);letter-spacing:.02em;}
#gv-start h2{margin:2px 0 0;font:700 38px/1.15 var(--hand);color:#fff;letter-spacing:.005em;}
#gv-start .gv-titlewrap{display:inline-block;max-width:100%;}
.gv-blurb{margin:14px auto 26px;max-width:410px;font:19px/1.45 var(--print);color:var(--chalk2);}
.gv-choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.gv-choice{display:flex;flex-direction:column;align-items:center;gap:4px;padding:15px 10px 13px;cursor:pointer;
  font-family:var(--print);color:var(--chalk);background:transparent;transition:transform .18s ease,background .18s ease;}
.gv-choice b{font:700 23px/1.2 var(--hand);color:inherit;} .gv-choice small{font-size:16.5px;color:var(--chalk3);}
.gv-choice:hover,.gv-choice:focus-visible{outline:none;transform:translateY(-2px) rotate(-.6deg);background:rgba(255,255,255,.05);}
.gv-choice.guide{border-color:rgba(251,227,138,.85);color:var(--yellow);background:rgba(251,227,138,.06);}
.gv-choice.guide small{color:#eadca6;}
.gv-choice.guide:hover,.gv-choice.guide:focus-visible{background:rgba(251,227,138,.12);}
.gv-ledge{position:absolute;left:-9px;right:-9px;bottom:-17px;height:11px;border-radius:2px;
  background:linear-gradient(var(--wood-hi),var(--wood) 45%,var(--wood2));box-shadow:0 4px 8px rgba(0,0,0,.4);}
.gv-ledge::after{content:"";position:absolute;right:72px;top:-5px;width:36px;height:7px;border-radius:3px;background:#f5f3ea;box-shadow:inset -3px 0 0 #dcd8c8,0 1px 2px rgba(0,0,0,.3);}
.gv-ledge::before{content:"";position:absolute;right:120px;top:-4px;width:18px;height:6px;border-radius:3px;background:#f3e3a0;box-shadow:inset -2px 0 0 #d9c77f,0 1px 2px rgba(0,0,0,.3);}
@media (max-width:480px){.gv-choices{grid-template-columns:1fr;}}

/* ---------- tour ---------- */
#gv-tour{position:fixed;inset:0;z-index:5500;pointer-events:none;}
#gv-tour[hidden]{display:none;}
#gv-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.gv-chalkline{fill:none;stroke:rgba(247,245,238,.92);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;filter:url(#gv-chalktex);}
.gv-chalkline.sec{stroke:rgba(251,227,138,.95);}
.gv-chalkline.draw{stroke-dasharray:100;stroke-dashoffset:100;animation:gvDraw2 .6s cubic-bezier(.4,.1,.3,1) forwards;}
@keyframes gvDraw2{to{stroke-dashoffset:0;}}
#gv-tour.gv-trigger #gv-svg > rect{opacity:0;}
#gv-hint{position:fixed;z-index:5450;box-sizing:border-box;max-width:min(280px,calc(100vw - 32px));padding:9px 30px 10px 14px;animation:gvIn .3s cubic-bezier(.2,.8,.2,1);}
#gv-hint[hidden]{display:none;}
#gv-hint p{margin:0;font:17px/1.35 var(--print);color:var(--chalk);}
#gv-hint p b{color:var(--yellow);}
#gv-hint #gv-hint-x{position:absolute;top:4px;right:8px;border:0;background:none;color:var(--chalk3);font:20px/1 var(--print);cursor:pointer;padding:0;}
#gv-hint #gv-hint-x:hover{color:#fff;}
#gv-hint .gv-notch{position:absolute;top:-16px;left:var(--nx,40px);width:0;height:0;border:9px solid transparent;border-bottom-color:var(--wood-hi);}
#gv-hint.below .gv-notch{top:auto;bottom:-16px;border-bottom-color:transparent;border-top-color:var(--wood-hi);}
#gv-hint.done p{color:#bdf5cc;}
.gv-tag{font:700 22px var(--hand);fill:var(--yellow);paint-order:stroke;stroke:rgba(4,8,12,.85);stroke-width:5px;stroke-linejoin:round;}
.gv-pointer{fill:none;stroke:rgba(251,227,138,.95);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:url(#gv-chalktex);}
.gv-pointer.draw{stroke-dasharray:100;stroke-dashoffset:100;animation:gvDraw2 .5s .15s cubic-bezier(.4,.1,.3,1) forwards;}
#gv-card{position:fixed;box-sizing:border-box;width:350px;max-width:calc(100vw - 32px);pointer-events:auto;padding:14px 18px 16px;
  transition:left .38s cubic-bezier(.2,.8,.2,1),top .38s cubic-bezier(.2,.8,.2,1);}
.gv-head{display:flex;align-items:baseline;gap:10px;}
.gv-chap{font:16px var(--print);color:var(--yellow);letter-spacing:.02em;}
.gv-count{margin-left:auto;font:15px var(--print);color:var(--chalk3);white-space:nowrap;}
.gv-tally{display:inline-flex;gap:3px;margin-left:7px;}
.gv-tally i{width:2px;height:12px;background:rgba(247,245,238,.25);border-radius:1px;transform:rotate(9deg);transition:background .3s;}
.gv-tally i.on{background:var(--chalk);}
#gv-close{border:0;background:none;color:var(--chalk3);font:22px/1 var(--print);cursor:pointer;padding:0 2px;margin-left:4px;}
#gv-close:hover{color:#fff;}
.gv-body h4{margin:6px 0 1px;font:700 25px/1.15 var(--hand);color:#fff;letter-spacing:.005em;}
.gv-body .gv-titlewrap{display:inline-block;max-width:100%;}
#gv-text p{margin:7px 0 0;font:18px/1.45 var(--print);color:var(--chalk2);}
.gv-body,#gv-text p,.gv-try{overflow-wrap:anywhere;}
.gv-try{display:flex;align-items:baseline;gap:8px;margin:13px 0 2px;padding:9px 13px;font:17.5px/1.4 var(--print);color:var(--yellow);
  border-color:rgba(251,227,138,.65);background:rgba(251,227,138,.05);}
.gv-try .gv-tl{flex:0 0 auto;font-family:var(--hand);font-weight:700;}
.gv-try.ok{color:#bdf5cc;border-color:rgba(189,245,204,.75);background:rgba(189,245,204,.06);}
.gv-tick{display:inline-block;width:22px;height:16px;vertical-align:-2px;}
.gv-tick path{fill:none;stroke:#bdf5cc;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:gvDraw .35s ease-out forwards;}
.gv-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:15px;}
.gv-spacer{flex:1;}
#gv-voice{white-space:nowrap;font:16px/1 var(--print);color:var(--chalk3);background:none;border:0;cursor:pointer;padding:4px 2px;}
#gv-voice:hover{color:#fff;}
#gv-voice .gv-waves{display:inline-block;width:14px;opacity:0;}
.gv-speaking #gv-voice .gv-waves{animation:gvBlink 1s ease-in-out infinite;}
@keyframes gvBlink{50%{opacity:1;}}
.gv-final{display:flex;align-items:center;gap:10px;margin-top:14px;}
.gv-final .gv-textbtn{font:16px var(--print);}
.gv-cbtn[hidden],.gv-try[hidden],.gv-final[hidden],.gv-foot[hidden]{display:none;}
@media (max-width:640px){#gv-card{width:calc(100vw - 32px);}}

/* ---------- Free exploration: where to start ---------- */
#gv-free{position:fixed;inset:0;z-index:5550;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,8,12,.38);}
#gv-free[hidden]{display:none;}
#gv-free .gv-board{box-sizing:border-box;width:min(520px,100%);padding:22px 28px 22px;animation:gvIn .35s cubic-bezier(.2,.8,.2,1);}
#gv-free .gv-x{position:absolute;top:8px;right:12px;border:0;background:none;color:var(--chalk3);font:24px/1 var(--print);cursor:pointer;}
#gv-free .gv-x:hover{color:#fff;}
#gv-free h3{margin:0 26px 0 0;font:700 26px/1.25 var(--hand);color:#fff;}
.gv-flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:start;gap:0 8px;margin:16px 0 2px;text-align:center;}
.gv-flow .gv-step{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;}
.gv-flow .gv-step b{font:700 23px/1.15 var(--hand);color:var(--yellow);}
.gv-flow .gv-step span{font:16px/1.3 var(--print);color:var(--chalk3);}
.gv-flow .gv-arr{color:var(--chalk3);font:22px/1.15 var(--hand);padding-top:1px;}
.gv-rule{height:8px;margin:14px 0 10px;}
.gv-rule path{fill:none;stroke:rgba(247,245,238,.35);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:5 6;}
.gv-one-k{margin:0;font:15px var(--print);color:var(--chalk3);letter-spacing:.04em;}
.gv-one{margin:4px 0 0;font:18.5px/1.45 var(--print);color:var(--chalk);}
#gv-free .gv-final{margin-top:18px;}

/* ---------- the sim waits for Play ---------- */
.gv-attn{position:relative;animation:gvPulse 1.5s ease-out infinite !important;}
@keyframes gvPulse{0%{box-shadow:0 0 0 0 rgba(251,191,36,.75);}70%{box-shadow:0 0 0 12px rgba(251,191,36,0);}100%{box-shadow:0 0 0 0 rgba(251,191,36,0);}}
#gv-playtip{position:fixed;z-index:5560;pointer-events:none;padding:6px 12px 5px;font:17px/1.2 var(--print);color:var(--yellow);white-space:nowrap;
  background:linear-gradient(165deg,var(--board),var(--board2));border-radius:6px;box-shadow:0 0 0 2px var(--wood-hi),0 6px 16px rgba(0,0,0,.4);
  animation:gvBob 1.6s ease-in-out infinite;}
#gv-playtip::before{content:"";position:absolute;top:-7px;right:var(--ax,24px);border:7px solid transparent;border-top:0;border-bottom-color:var(--wood-hi);}
#gv-playtip[hidden]{display:none;}
@keyframes gvBob{50%{transform:translateY(3px);}}

/* ---------- Physics sheet: the one-line summary, front and centre ---------- */
.gv-oneline{margin:4px 0 22px;padding:14px 18px 15px;border-radius:10px;border:1px solid var(--accent-soft,rgba(59,155,143,.35));
  border-left:4px solid var(--accent,#3b9b8f);background:var(--ctrl-bg,rgba(30,77,58,.15));}
.gv-oneline .gv-ok{margin:0 0 4px;font:600 12px/1 var(--font-sans,inherit);letter-spacing:.12em;text-transform:uppercase;color:var(--accent,#3b9b8f);}
.gv-oneline .gv-ot{margin:0;font:500 17px/1.5 var(--font-sans,inherit);color:var(--text,#e2e8f0);}
@media (prefers-reduced-motion:reduce){.gv-write{clip-path:none;animation:none;}.gv-w{opacity:1;transform:none;animation:none;}
  .gv-underline path,.gv-tick path,.gv-chalkline.draw,.gv-pointer.draw{animation:none;stroke-dashoffset:0;stroke-dasharray:none;}
  .gv-erasing .gv-body,.gv-erasing .gv-head .gv-chap{animation:none;}#gv-card{transition:none;}.gv-attn,#gv-playtip{animation:none !important;}}
</style>

<div id="gv-start" role="dialog" aria-modal="true" aria-labelledby="gv-start-title" data-no-reset hidden>
  <div class="gv-board">
    <p class="gv-kicker">Welcome to</p>

      <svg class="gv-underline" viewBox="0 0 200 9" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M3 5 C 50 2, 110 8, 197 3"/></svg></span>

</div>

<div id="gv-tour" data-no-reset hidden>
  <svg id="gv-svg" aria-hidden="true">
    <defs><filter id="gv-chalktex" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/></filter>

<script id="gv-spec">
__SPEC__
</script>
<script id="gv-engine">
(function(){
  'use strict';
  var SPEC=window.__GV_SPEC; if(!SPEC) return;
  var $=function(id){return document.getElementById(id);};
  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
  var q=function(sel){ var e=document.querySelector(sel); return e; };
  var vis=function(e){ if(!e) return false; var r=e.getBoundingClientRect(); return r.width>0&&r.height>0; };

  /* ---------- the guide: the simulation window first, then the sidebar. The last step also points at Play.
     Explore freely gets one trigger step: press Play and watch what changes. ---------- */
  /* CUE: what the last card and the Done cue point at: Play, or the trigger control in static sims (no SPEC.play) */
  var CUE=SPEC.play||(SPEC.trigger&&SPEC.trigger.at)||null, STATIC=!SPEC.play;
  var GUIDE=SPEC.steps.map(function(s,k,arr){ if(k<arr.length-1) return s;
    var o={}; for(var x in s) o[x]=s[x];
    o.final=true; o.points=function(){ return [CUE]; };
    o.text=s.text+(SPEC.playText||''); o.say=s.say+(SPEC.playSay?' '+SPEC.playSay:''); return o; });
  var TRIGGER={chap:'Explore freely', title:'Start here', final:true, trigger:true, points:function(){ return [CUE]; },
    text:SPEC.trigger.text, say:SPEC.trigger.say};
  var steps=GUIDE, triggerOn=false;

  /* ---------- the sim waits for Play ---------- */
  var playBtn=function(){ return SPEC.play?q(SPEC.play):null; };
  var cueEl=function(){ return CUE?q(CUE):null; };
  var isPlaying=function(){ var b=playBtn(); return !!b&&/pause/i.test(b.textContent||''); };
  var giOn=function(){ var b=$('btn-gi'); return !!b&&b.classList.contains('active'); };
  var userStarted=false, holdUntil=0, attn=false;
  function pauseSim(){ if(isPlaying()){ var b=playBtn(); if(b) b.click(); } }
  function hold(ms){ holdUntil=performance.now()+ms; userStarted=false; pauseSim(); }
  (function(){ var b=playBtn(); if(b) b.addEventListener('pointerdown',function(){ userStarted=true; holdUntil=0; },true);
    if(b) b.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ userStarted=true; holdUntil=0; } },true);
    var tg=SPEC.trigger&&SPEC.trigger.at&&q(SPEC.trigger.at);   /* using the trigger control also counts: never re-pause after it */
    if(tg&&tg!==b) ['pointerdown','input','change','keydown'].forEach(function(ev){ tg.addEventListener(ev,function(){ if(!tourOn){ userStarted=true; holdUntil=0; } },true); }); })();

    var t=$('gv-tally'); t.innerHTML=''; for(var k=0;k<steps.length;k++){ var e=document.createElement('i'); if(k<=i) e.className='on'; t.appendChild(e); } }
  function voiceState(talking){ var b=$('gv-voice'); b.setAttribute('aria-pressed',String(voiceOn)); $('gv-voice-lab').textContent=voiceOn?'voice':'muted';
    card.classList.toggle('gv-speaking',!!talking&&voiceOn); b.title=voiceOn?'Mute the guide':'Let the guide talk you through it'; }
  function narrate(){ if(!voiceOn||!VOICE.ok) return; VOICE.onState=function(s){ voiceState(s); }; VOICE.say(steps[i].say||''); }
  var TICK='<svg class="gv-tick" viewBox="0 0 22 16" aria-hidden="true"><path pathLength="1" d="M2 9 L8 14 L20 2"/></svg>';
  function setTry(kind,label,msg){ var tr=$('gv-try'); tr.hidden=false; tr.className='gv-try gv-hand'+(kind?' '+kind:'');
    tr.innerHTML=(kind==='ok'?TICK:'')+'<span class="gv-tl">'+label+'</span><span>'+msg+'</span>'; }
  function scrollTargets(st){
    (st.targets?st.targets():[]).forEach(function(t){ if(t&&t.sel&&!t.avoid){ var e=q(t.sel); if(e&&e.scrollIntoView&&!(t.noScroll)){ var r=e.getBoundingClientRect();
      if(r.bottom>innerHeight-16||r.top<hdrBottom()+8) e.scrollIntoView({block:'center',inline:'nearest'}); } } });
  }
  async function render(){
    var st=steps[i], my=++gen; clearInterval(poll); place=null; lastKey='';
    if(card.dataset.shown){ card.classList.add('gv-erasing'); await sleep(170); if(my!==gen) return; }
    card.classList.remove('gv-erasing'); card.dataset.shown='1';
    if(st.enter) st.enter();
    scrollTargets(st);
    $('gv-chap').textContent=st.chap; $('gv-title').textContent=st.title; rewrite($('gv-title'));
    $('gv-text').innerHTML=chalkWords(st.text,450);
    $('gv-back').disabled=i===0;
    var tr=$('gv-try'), fin=$('gv-final'), foot=$('gv-foot');
    tr.hidden=true;
    /* the voice control stays on every card, the last one included */
    var vb=$('gv-voice'); if(st.final){ if(vb.parentNode!==fin) fin.insertBefore(vb,$('gv-fin-back').nextSibling); } else if(vb.parentNode!==foot) foot.insertBefore(vb,$('gv-back').nextSibling);
    if(st.final){
      foot.hidden=true; fin.hidden=false; setAttn(!isPlaying());
      $('gv-fin-back').hidden=!!st.trigger; $('gv-fin-gi').hidden=!!st.trigger; $('gv-fin-free').textContent=st.trigger?'Close':'Done';
      if(isPlaying()) setTry('ok','It’s running.','');   /* otherwise the card line + the tag under Play say it once */
      poll=setInterval(function(){
        if(my!==gen) return clearInterval(poll);
        if(isPlaying()){ clearInterval(poll); setTry('ok','It’s running.','');
          setTimeout(function(){ if(tourOn&&my===gen) end('free'); },1500); }
      },150);
    } else { fin.hidden=true; foot.hidden=false; setAttn(false); $('gv-next').innerHTML='next &rarr;'; }
    progress(); requestAnimationFrame(function(){ layout(true); }); setTimeout(function(){ layout(true); },380); narrate();
  }
  function go(d){ var n=i+d; if(n<0||n>=steps.length) return; i=n; render(); }
  /* no-spoiler staging: the sim's own __cgPrepare (the old guide's staging), then the spec's start() */
  var staged=false;
  function stage(){
    if(window.__setMode) window.__setMode('free');
    if(window.__cgPrepare&&SPEC.stage!==false){ try{ window.__cgPrepare(); staged=true; }catch(e){} }
    hold(1e9); setTimeout(pauseSim,60);
    if(SPEC.start) SPEC.start();
  }
  function unstage(mode){
    if(!staged) return; staged=false;
    if(mode==='inquiry'||mode==='quiet') return;          /* the Guided Inquiry takes over and sets its own scene */
    var was=isPlaying();
    try{ if(window.__giResume) window.__giResume(); if(window.__freeExplore) window.__freeExplore(); }catch(e){}
    if(!was){ hold(700); setTimeout(pauseSim,40); }       /* leaving the tour never starts the sim by itself */
  }
  /* Reset while the tour is open: the spec decides (onReset), else the tour stays on its step, re-staged; never the Guided Inquiry */
  var resetTour=false;   /* true while a Reset pressed during the tour is being handled: the sim's own mode-local reset must not end it */
  (function(){ var r=SPEC.reset&&q(SPEC.reset); if(!r) return;
    r.addEventListener('click',function(){ resetTour=tourOn&&!triggerOn; },true);
    r.addEventListener('click',function(){ if(!resetTour) return;
      setTimeout(function(){ if(!resetTour) return;
        if(SPEC.onReset){ try{ SPEC.onReset(); }catch(e){} }
        else { if(giOn()&&window.__setMode) window.__setMode('free'); stage(); }
        tourOn=true; tour.hidden=false; var cg=$('btn-cg'); if(cg) cg.classList.add('active'); setAttn(false); render();
        /* a mode-local reset may switch to the Guided Inquiry a moment later: undo that while the tour is open */
        [250,600].forEach(function(ms){ setTimeout(function(){ if(tourOn&&!SPEC.onReset&&giOn()&&window.__setMode){ window.__setMode('free'); stage(); var cg2=$('btn-cg'); if(cg2) cg2.classList.add('active'); } if(ms===600) resetTour=false; },ms); });
      },80); }); })();
  function begin(mode){
    closeStart(); if(!freeEl.hidden) freeEl.hidden=true;
    triggerOn=mode==='trigger'; steps=triggerOn?[TRIGGER]:GUIDE; tour.classList.toggle('gv-trigger',triggerOn);
    if(!triggerOn){
      var sh=$('shell'), tab=$('sb-hide-tab'); if(sh&&sh.classList.contains('shell-max')&&tab) tab.click();
      stage();
    }
    tourOn=true; tour.hidden=false; var cg=$('btn-cg'); if(cg) cg.classList.add('active'); voiceState(false);
    placeTip(); i=0; setTimeout(render,150);
  }
  function end(mode){
    if(!tourOn) return;
    if(resetTour&&(mode==='quiet'||mode==='inquiry')) return;   /* Reset during the tour keeps the tour */
    tourOn=false; gen++; clearInterval(poll); tour.hidden=true; delete card.dataset.shown; var cg=$('btn-cg'); if(cg) cg.classList.remove('active');
    VOICE.stop(); card.classList.remove('gv-speaking'); holdUntil=0;
    unstage(mode);
    if(mode==='inquiry'){ setAttn(false); holdUntil=0; if(window.__setMode) window.__setMode('inquiry'); }
    else if(mode==='done') flashAttn();      /* finished the guide: a short cue at Play (the trigger control in static sims) */
    else setAttn(false);
    if(SPEC.end){ try{ SPEC.end(mode); }catch(e){} }
  }
  $('gv-next').addEventListener('click',function(){ go(1); });
  $('gv-back').addEventListener('click',function(){ go(-1); });
  $('gv-fin-back').addEventListener('click',function(){ go(-1); });
  $('gv-fin-free').addEventListener('click',function(){ end(triggerOn?'free':'done'); });
  $('gv-fin-gi').addEventListener('click',function(){ end('inquiry'); });
  $('gv-close').addEventListener('click',function(){ end('free'); });
  $('gv-voice').addEventListener('click',function(){ voiceOn=!voiceOn; voiceState(false); if(voiceOn){ VOICE.unlock(); narrate(); } else VOICE.stop(); });
  if(!VOICE.ok) $('gv-voice').hidden=true;

  /* the header's Simulation guide button opens this guide; Guided Inquiry closes it */
  var cgBtn=$('btn-cg');
  if(cgBtn) cgBtn.addEventListener('click',function(e){ e.stopImmediatePropagation(); e.preventDefault();
    if(tourOn) end('free'); else { VOICE.unlock(); hideHint(); closeFree(function(){}); begin(); } },true);
  var giBtn=$('btn-gi');
  if(giBtn) giBtn.addEventListener('click',function(e){ if(!e.isTrusted) return;   /* the sim's own code clicking it (mode switches) is not the learner */
  holdUntil=0; if(tourOn) end('quiet'); hideHint(); closeFree(function(){}); setAttn(false);
},true);

  document.addEventListener('keydown',function(e){
    var tag=((e.target||{}).tagName)||'';
    if(!startEl.hidden){ if(e.key==='Escape'){ e.stopImmediatePropagation(); closeStart(); enterFree(false); } return; }
    if(!freeEl.hidden){ if(e.key==='Escape'){ e.stopImmediatePropagation(); closeFree(); } return; }
    if(!tourOn) return;
    if(e.key==='Escape'){ e.stopImmediatePropagation(); end('free'); }
    else if(e.key==='ArrowRight'&&!/INPUT|SELECT|TEXTAREA/.test(tag)&&!steps[i].final){ go(1); }
    else if(e.key==='ArrowLeft'&&!/INPUT|SELECT|TEXTAREA/.test(tag)){ go(-1); }
  },true);
  addEventListener('resize',function(){ place=null; layout(true); });
  setInterval(function(){ if(tourOn) layout(false); },250);
  window.__gv={showHint:showHint,hideHint:hideHint,get hint(){ return !hintEl.hidden; },begin:begin,end:end,go:go,get step(){return i;},get active(){return tourOn;},get steps(){return steps;},isPlaying:isPlaying,get attn(){return attn;}};
})();
</script>
