<div id="phys-backdrop" role="dialog" aria-modal="true" aria-label="The Physics — revision sheet for {{TITLE}}">
  <div class="phys-modal">
    <div class="phys-head">
      <div class="phys-title">
        <h2>The Physics</h2>
        <p class="phys-kicker">{{TITLE}} · a complete revision sheet</p>
      </div>
      <button id="phys-download" class="shell-btn primary" title="Save this sheet as a standalone page — print to PDF from inside it">⬇ Download sheet</button>
      <button id="phys-close" class="shell-btn shell-modal-close" title="Close (Esc)">✕</button>
    </div>
    <div class="phys-body">
      {{ARTICLE}}
    </div>
  </div>
</div>
<div id="phys-toast"></div>
