<!-- PHYSICS SHEET v2 — sectioned read → see layer (pilot). Additive: pages the
     article's <section class="ps-sec"> blocks one at a time with a contents rail,
     adds the "See it" return card and the ⌖ locate buttons. The download clone
     still receives every section (they are hidden only on screen). -->
<style>
.phys-body.ps-on{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0 22px;align-items:start;}
.ps-rail{position:sticky;top:0;display:flex;flex-direction:column;gap:3px;padding:4px 0;}
.ps-rail-h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);margin:0 0 6px 10px;}
.ps-rail button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:22px 1fr 14px;align-items:center;gap:6px;
  padding:7px 10px;border-radius:8px;font-size:12.5px;line-height:1.3;color:var(--ink-mid);cursor:pointer;}
.ps-rail button:hover{background:var(--surface-soft);color:var(--text);}
.ps-rail button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.ps-rail button .n{font:600 12px/1 'STIX Two Text',Georgia,serif;color:var(--ink-mute);}
.ps-rail button .t{color:var(--accent);font-size:11px;opacity:0;}
.ps-rail button.seen .t{opacity:1;}
.ps-rail button[aria-current="true"]{background:var(--surface-soft);color:var(--text);font-weight:600;box-shadow:inset 3px 0 0 var(--accent);}
.ps-rail button[aria-current="true"] .n{color:var(--accent);}
.ps-main{min-width:0;}
/* one fixed size for every section: the modal fills the space the seat script allows */
#phys-backdrop .phys-modal{height:calc(100vh - 104px);}
#phys-backdrop .phys-body{flex:1 1 auto;min-height:0;}
.ps-pager{flex-shrink:0;margin:0;padding:12px 28px 14px 240px;border-top:1px solid var(--line);}
.phys-body.ps-on .phys-art{max-width:none;}
.ps-sec[hidden]{display:none;}
.ps-h{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line);}
.ps-no{font:600 20px/1 'STIX Two Text',Georgia,serif;color:var(--accent);}
.ps-h h3{margin:0;font:600 21px/1.25 'STIX Two Text',Georgia,serif;color:var(--text);}
.ps-sub{margin:18px 0 6px;font:600 15px/1.3 'STIX Two Text',Georgia,serif;color:var(--text);}
.ps-p{margin:8px 0;font-size:13.5px;line-height:1.62;color:var(--ink-mid);}
.ps-p b{color:var(--text);}
.ps-glance{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;}
.ps-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface-soft);}
.ps-card h4{margin:0 0 2px;font:600 15px/1.3 'STIX Two Text',Georgia,serif;color:var(--text);}
.fig.f0{margin:0;}
.phys-modal{width:min(1010px,96vw);}
.fig.f0 svg{max-width:320px;}
.ps-keys{list-style:none;margin:6px 0 0;padding:0;font-size:13px;line-height:1.55;color:var(--ink-mid);}
.ps-keys li{position:relative;padding-left:30px;margin:7px 0;}
.ps-keys b{color:var(--text);}
.ps-chip{position:absolute;left:0;top:.72em;width:18px;height:0;border-top:3px solid;}
.ps-chip.ps-dash{border-top-style:dashed;}
.ps-chip.ps-box{top:.4em;left:3px;height:9px;width:12px;border:1.5px solid var(--ink-mute);border-radius:3px;}
.ps-key{margin:12px 0;padding:11px 14px;border-radius:9px;background:rgba(59,155,143,.10);border:1px solid var(--accent-soft);
  font-size:13.5px;line-height:1.55;color:var(--text);}
.ps-note{font-size:12px;color:var(--ink-mute);margin:10px 0 0;}
.ps-ctl,.ps-num{width:100%;border-collapse:collapse;font-size:12.5px;color:var(--ink-mid);margin:8px 0;}
.ps-ctl th,.ps-num th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-mute);
  padding:6px 8px;border-bottom:1px solid var(--line);}
.ps-ctl td,.ps-num td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45;}
.ps-ctl td b{color:var(--text);}
.ps-ctl td small{color:var(--ink-mute);}
.ps-ctl td:nth-child(3){white-space:nowrap;font-family:var(--font-nums);font-size:12px;}
.ps-num td{font-family:var(--font-nums);color:var(--text);}
.ps-loc{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;
  border:1px solid var(--line);color:var(--accent);font-size:15px;}
.ps-loc:hover{border-color:var(--accent);background:var(--surface-soft);}
.ps-loc:focus-visible{outline:2px solid var(--accent);}
.ps-try{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:18px 0 4px;padding:12px 14px;border-radius:10px;
  border:1px dashed var(--accent);background:linear-gradient(90deg,rgba(59,155,143,.12),transparent 80%);}
.ps-try-txt{flex:1 1 260px;font-size:13px;line-height:1.5;color:var(--text);}
.ps-try-tag{display:inline-block;margin-right:8px;padding:2px 8px;border-radius:999px;background:var(--accent);color:#fff;
  font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:1px;}
.ps-watch{display:block;margin-top:3px;color:var(--ink-mid);}
.ps-try .seesim{margin:0;}
.ps-deep{margin:14px 0 0;border:1px solid var(--line);border-radius:9px;padding:9px 12px;}
.ps-deep summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--text);}
.ps-myth{list-style:none;margin:6px 0;padding:0;font-size:13px;line-height:1.55;color:var(--ink-mid);}
.ps-myth li{margin:7px 0;padding-left:12px;border-left:2px solid var(--line);}
.ps-myth span{display:block;color:var(--text);font-style:italic;}
.ps-pager{display:flex;align-items:center;gap:10px;}
.ps-pager .ps-count{flex:1;text-align:center;font-size:12px;color:var(--ink-mute);}
.ps-pager button[disabled]{opacity:.35;cursor:default;}
/* the "watching" card shown over the sim after a See-it */
#ps-watch{position:fixed;left:var(--ps-watch-left,16px);right:var(--ps-watch-right,auto);bottom:var(--ps-watch-bottom,16px);z-index:3100;width:min(360px,calc(100vw - 32px));
  background:var(--ps-watch-bg,var(--panel-2,var(--bg-panel,#0b1417)));border:1px solid var(--accent-soft);border-left:3px solid var(--accent);border-radius:10px;
  box-shadow:0 14px 36px rgba(0,0,0,.45);padding:11px 13px 11px;color:var(--text);font-size:12.5px;line-height:1.45;
  opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;}
#ps-watch.show{opacity:1;transform:none;pointer-events:auto;}
#ps-watch .w-k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700;}
#ps-watch .w-m{margin:4px 0 10px;color:var(--ink-mid);}
#ps-watch .w-m b{color:var(--text);}
#ps-watch .w-b{display:flex;gap:8px;flex-wrap:wrap;}
#ps-watch .w-x{position:absolute;top:6px;right:8px;all:unset;cursor:pointer;color:var(--ink-mute);font-size:14px;padding:2px 6px;}
#ps-watch .w-x{position:absolute;top:6px;right:6px;}
#ps-watch .w-k{padding-right:28px;}
.ps-spot{outline:3px solid var(--accent) !important;outline-offset:3px;border-radius:8px;animation:psSpot 1.1s ease-in-out 3;}
@keyframes psSpot{50%{outline-color:transparent;}}
@media(max-width:760px){
  .phys-body.ps-on{grid-template-columns:1fr;}
  .ps-rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--line);}
  .ps-rail-h{display:none;}
  .ps-pager{padding:10px 16px 12px;}
  .ps-rail button{grid-template-columns:auto;white-space:nowrap;}
  .ps-rail button .l,.ps-rail button .t{display:none;}
  .ps-glance{grid-template-columns:1fr;}
  .ps-ctl td:nth-child(3){white-space:normal;}
}
@media(prefers-reduced-motion:reduce){#ps-watch{transition:none;}.ps-spot{animation:none;}}
</style>
<style>
/* Fallbacks for sims that lack the Shell's button class (pre-shell QM family): zero specificity, so any rule the sim
   already has for .shell-btn wins. The See-it card also takes three optional knobs a sim sets in its persim block:
   --ps-watch-left / --ps-watch-right / --ps-watch-bottom (move the card off a plot) and --ps-watch-bg (a solid colour
   when the sim's --panel-2 is translucent or undefined). */
:where(#phys-backdrop,#ps-watch) .shell-btn{font:inherit;font-size:12.5px;line-height:1.2;padding:7px 12px;border-radius:8px;border:1px solid var(--line,rgba(127,127,127,.4));background:var(--surface-soft,rgba(127,127,127,.12));color:var(--text,inherit);cursor:pointer;}
:where(#phys-backdrop,#ps-watch) .shell-btn.primary{background:var(--accent,#3b9b8f);border-color:var(--accent,#3b9b8f);color:#fff;}
:where(#phys-backdrop,#ps-watch) .shell-btn:disabled{opacity:.4;cursor:default;}
</style>
<style>
/* round 3 — spoiler gate, footer jump, live card, a11y, phone, light theme */
.ps-gate{margin:30px auto;max-width:520px;padding:18px 20px;border:1px solid var(--accent-soft);border-radius:12px;background:var(--surface-soft);
  font-size:13.5px;line-height:1.55;color:var(--ink-mid);}
.ps-gate b{color:var(--text);}
.ps-gate b:focus{outline:none;}
.ps-gate-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.ps-rail button.locked .l{opacity:.55;}
.ps-rail-k{margin:10px 0 0 10px;font-size:11px;color:var(--ink-mute);}
.ps-rail-k span{color:var(--accent);}
.ps-h h3:focus{outline:none;}
.ps-pager .ps-more{flex:1;max-width:220px;margin:0 auto;}
#ps-more[hidden],.ps-count[hidden]{display:none !important;}
#ps-watch{visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s linear .2s;}
#ps-watch.show{visibility:visible;transition-delay:0s;}
#ps-watch .w-live{margin:-4px 0 10px;padding:6px 9px;border-radius:7px;background:var(--surface-soft);font-family:var(--font-nums);font-size:12.5px;color:var(--ink-mid);}
#ps-watch .w-live b{color:var(--text);}
@media(max-width:760px){
  .phys-body.ps-on{display:block;}
  .ps-rail{margin-bottom:14px;padding-bottom:10px;}
  .ps-rail button[aria-current="true"] .l{display:inline;}
  .ps-rail-k{display:none;}
  .ps-gate{margin:10px 0;}
  #ps-watch{left:0;right:0;bottom:0;width:auto;border-radius:12px 12px 0 0;border-left:1px solid var(--accent-soft);border-top:3px solid var(--accent);}
}
@media(max-width:420px){ .ps-pager .ps-count{display:none;} .ps-pager{gap:6px;} }
</style>
<div id="ps-watch" role="status" aria-live="polite">
  <button class="w-x" id="ps-w-x" title="Dismiss">✕</button>
  <div class="w-k" id="ps-w-k"></div>
  <div class="w-m" id="ps-w-m"></div>
  <div class="w-live" id="ps-w-live" hidden></div>
  <div class="w-b">
    <button class="shell-btn" id="ps-w-back">↩ Back to the sheet</button>
    <button class="shell-btn primary" id="ps-w-next"></button>
  </div>
</div>
<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var backdrop=$('phys-backdrop'), art=$('phys-art');
  if(!backdrop||!art) return;
  var body=art.closest('.phys-body'), modal=backdrop.querySelector('.phys-modal');
  var secs=Array.prototype.slice.call(art.querySelectorAll('.ps-sec'));
  if(!body||!secs.length) return;
  /* sections from data-gate-from (0-based, default 2) on explain the Guided Inquiry's answers */
  var GATE_FROM=parseInt(art.getAttribute('data-gate-from')||'2',10);
  function giActive(){ var c=$('inq-cards'); return !!(c&&c.offsetParent); }
  function short(i){ return secs[i].getAttribute('data-short'); }
  function nn(i){ return String(i+1).padStart(2,'0'); }

  /* ---- layout: rail | (article), fixed footer pager ---- */
  var main=document.createElement('div'); main.className='ps-main';
  art.parentNode.insertBefore(main,art); main.appendChild(art);
  var rail=document.createElement('nav'); rail.className='ps-rail'; rail.setAttribute('aria-label','Sections');
  rail.innerHTML='<div class="ps-rail-h">Contents</div>';
  body.insertBefore(rail,main); body.classList.add('ps-on');
  var gate=document.createElement('div'); gate.className='ps-gate'; gate.hidden=true;
  gate.innerHTML='<p><b>This section explains answers from the Guided Inquiry.</b> Finish the inquiry first and it will mean more, or read on now if you prefer.</p>'
    +'<div class="ps-gate-b"><button class="shell-btn" id="ps-gate-back">↩ Back to the inquiry</button><button class="shell-btn primary" id="ps-gate-read">Read anyway</button></div>';
  main.insertBefore(gate,art);
  var pager=document.createElement('div'); pager.className='ps-pager';
  pager.innerHTML='<button class="shell-btn" id="ps-prev">‹ Previous</button><span class="ps-count" id="ps-count"></span><button class="shell-btn ps-more" id="ps-more" hidden>▼ See it below</button><button class="shell-btn primary" id="ps-next"></button>';
  body.parentNode.insertBefore(pager,body.nextSibling);
  var seen={}, cur=0, readAnyway=false;
  var tabs=secs.map(function(s,i){
    var b=document.createElement('button'); b.type='button';
    b.innerHTML='<span class="n">'+nn(i)+'</span><span class="l">'+short(i)+'</span><span class="t" aria-hidden="true">✓</span>';
    b.setAttribute('aria-label','Section '+nn(i)+': '+short(i));
    b.addEventListener('click',function(){go(i,false,true);});
    rail.appendChild(b); return b;
  });
  var legend=document.createElement('div'); legend.className='ps-rail-k';
  legend.innerHTML='<span>✓</span> watched in the sim'; rail.appendChild(legend);
  var cnt=secs.filter(function(s){return s.querySelector('.ps-try');}).length;

  function gated(i){ return i>=GATE_FROM && giActive() && !readAnyway; }
  function go(i,keepScroll,focus){
    cur=Math.max(0,Math.min(secs.length-1,i));
    var g=gated(cur);
    gate.hidden=!g;
    secs.forEach(function(s,k){ s.hidden=(k!==cur)||g; });
    if(g) gate.querySelector('p b').textContent='Section '+nn(cur)+' explains answers from the Guided Inquiry.';
    tabs.forEach(function(b,k){ b.setAttribute('aria-current',k===cur?'true':'false'); b.classList.toggle('seen',!!seen[k]); b.classList.toggle('locked',gated(k)); });
    $('ps-prev').disabled=(cur===0);
    $('ps-next').textContent=(cur===secs.length-1)?'Close and explore ✕':'Next: '+short(cur+1)+' ›';
    $('ps-count').textContent=(cur+1)+' of '+secs.length;
    if(!keepScroll) body.scrollTop=0;
    if(focus){ var h=g?gate.querySelector('b'):secs[cur].querySelector('h3'); if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); } }
    more();
  }
  /* the See-it box may sit below the fold on short windows: offer a jump */
  function more(){
    var m=$('ps-more'), t=secs[cur].hidden?null:secs[cur].querySelector('.ps-try');
    var below=false;
    if(t&&backdrop.classList.contains('open')){ below=t.getBoundingClientRect().top>body.getBoundingClientRect().bottom-24; }
    var had=(document.activeElement===m);
    m.hidden=!below; $('ps-count').hidden=below;
    if(had&&!below) $('ps-next').focus({preventScroll:true});   /* never strand keyboard focus on a vanishing chip */
  }
  body.addEventListener('scroll',more,{passive:true});
  window.addEventListener('resize',more);
  $('ps-more').addEventListener('click',function(){
    var t=secs[cur].querySelector('.ps-try'); if(!t) return;
    t.scrollIntoView({block:'center',behavior:'smooth'});
    var b=t.querySelector('.seesim'); if(b) setTimeout(function(){b.focus({preventScroll:true});},350);
  });
  $('ps-prev').addEventListener('click',function(){go(cur-1,false,true);});
  $('ps-next').addEventListener('click',function(){
    if(cur===secs.length-1){ $('phys-close').click(); return; }
    go(cur+1,false,true);
  });
  $('ps-gate-read').addEventListener('click',function(){ readAnyway=true; go(cur,false,true); });
  $('ps-gate-back').addEventListener('click',function(){ $('phys-close').click(); });

  /* keyboard: ←/→ page, Tab stays inside the open sheet */
  document.addEventListener('keydown',function(e){
    if(!backdrop.classList.contains('open')) return;
    var t=e.target;
    if(e.key==='Tab'){
      var f=Array.prototype.filter.call(modal.querySelectorAll('button,a[href],input,select,summary,[tabindex="0"]'),function(x){return !x.disabled&&x.offsetParent;});
      if(!f.length) return;
      var a=f[0], z=f[f.length-1];
      if(!modal.contains(document.activeElement)){ a.focus(); e.preventDefault(); }
      else if(e.shiftKey&&document.activeElement===a){ z.focus(); e.preventDefault(); }
      else if(!e.shiftKey&&document.activeElement===z){ a.focus(); e.preventDefault(); }
      return;
    }
    if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA')) return;
    if(e.key==='ArrowRight'){ go(cur+1,false,true); e.preventDefault(); }
    else if(e.key==='ArrowLeft'){ go(cur-1,false,true); e.preventDefault(); }
  });
  /* backstop for the trap: focus that lands outside the open sheet by any route comes back */
  document.addEventListener('focusin',function(e){
    if(!backdrop.classList.contains('open')||modal.contains(e.target)) return;
    var f=modal.querySelector('#phys-close'); if(f) f.focus({preventScroll:true});
  });
  go(0);

  /* ---- open at a section; remember the opener and give focus back on close ---- */
  var opener=null, toWatch=false;
  var openOrig=window.__openPhysics;
  window.__openPhysics=function(sec){
    hideWatch();
    var a=document.activeElement;
    opener=(a&&a!==document.body&&!backdrop.contains(a))?a:$('toggle-formal');
    go(typeof sec==='number'?sec:cur,typeof sec!=='number');
    openOrig.apply(this,arguments);
    setTimeout(more,0);
  };
  new MutationObserver(function(){
    if(backdrop.classList.contains('open')) return;
    if(toWatch){ toWatch=false; return; }
    var o=(opener&&opener.offsetParent)?opener:$('toggle-formal');
    if(o&&!watch.classList.contains('show')) try{o.focus({preventScroll:true});}catch(e){}
  }).observe(backdrop,{attributes:true,attributeFilter:['class']});

  /* ---- the "watching" card: read → see → come back ---- */
  var watch=$('ps-watch'), wSec=0, liveT=0, demoToken=0;
  function hideWatch(){ watch.classList.remove('show'); watch.setAttribute('inert',''); clearInterval(liveT); demoToken++; }
  hideWatch();
  /* data-live="Label=#selector|Label=#selector": mirror those sim readouts into the card */
  var liveSpec='';
  function liveLine(){
    $('ps-w-live').innerHTML=liveSpec.split('|').map(function(p){
      var k=p.split('='), e=document.querySelector(k[1]);
      return k[0]+' <b>'+(e?e.textContent.trim():'—')+'</b>';
    }).join(' · ');
  }
  function showWatch(i,msg,watchTxt,live){
    wSec=i; seen[i]=true; tabs[i].classList.add('seen');
    $('ps-w-k').textContent='Seeing section '+nn(i)+' · '+short(i);
    $('ps-w-m').innerHTML=msg+(watchTxt?'<br><b>'+watchTxt+'</b>':'');
    var L=$('ps-w-live'); L.hidden=!live; clearInterval(liveT);
    if(live){ liveSpec=live; liveLine(); liveT=setInterval(liveLine,200); }
    var nx=$('ps-w-next');
    if(i<secs.length-1){ nx.style.display=''; nx.textContent='Next: '+short(i+1)+' ›'; } else nx.style.display='none';
    watch.removeAttribute('inert'); watch.classList.add('show');
    toWatch=true; setTimeout(function(){ try{$('ps-w-back').focus({preventScroll:true});}catch(e){} },0);
  }
  window.__psWatch=function(btn,msg){
    var s=btn.closest('.ps-sec'), i=secs.indexOf(s); if(i<0) return false;
    var box=btn.closest('.ps-try'), w=box&&box.querySelector('.ps-watch');
    showWatch(i,msg,w?w.textContent:'',btn.getAttribute('data-live'));
    return true;
  };
  $('ps-w-back').addEventListener('click',function(){ window.__openPhysics(wSec); });
  $('ps-w-next').addEventListener('click',function(){ window.__openPhysics(wSec+1); });
  $('ps-w-x').addEventListener('click',function(){ hideWatch(); var t=$('toggle-formal'); if(t) t.focus({preventScroll:true}); });
  document.addEventListener('click',function(e){
    var c=e.target.closest&&e.target.closest('#shell-reset,#btn-gi,#btn-cg,#shell-lecture,.welcome-mode,#inq-next,#inq-prev,#inq-pager-next');
    /* pre-shell sims name their Reset / inquiry pager differently; only a real user click counts, so a scripted demo can still clear itself */
    if(c||(e.isTrusted&&e.target.closest&&e.target.closest('#reset,#resetBtn,#btnReset,#inq-pgnext,[data-ps-reset]'))) hideWatch();
  },true);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&watch.classList.contains('show')&&!backdrop.classList.contains('open')) hideWatch(); });

  /* ---- scripted demos: <button class="seesim" data-demo="name"> runs window.__psDemos[name](api) ----
     api.close() closes the sheet; api.show(msg, live) updates the card; api.alive() is false once the
     card is dismissed or the sim is re-staged (stop any loop then); api.watchText is the box's Watch-for. */
  Array.prototype.forEach.call(art.querySelectorAll('.seesim[data-demo]'),function(btn){
    btn.addEventListener('click',function(){
      var fn=(window.__psDemos||{})[btn.getAttribute('data-demo')]; if(!fn) return;
      var i=secs.indexOf(btn.closest('.ps-sec')), box=btn.closest('.ps-try'), w=box&&box.querySelector('.ps-watch');
      var api={ watchText:w?w.textContent:'', close:function(){ toWatch=true; $('phys-close').click(); },
        show:function(msg,live,noWatch){ var t=demoToken; showWatch(i,msg,noWatch?'':api.watchText,live||null); demoToken=t; },
        alive:null };
      api.close(); demoToken++; var tok=demoToken; api.alive=function(){ return tok===demoToken; };
      fn(api);
    });
  });

  /* ---- ⌖ locate: close the sheet and spotlight the control ---- */
  function spot(sel,miss){
    var t=document.querySelector(sel); if(!t) return;
    var shell=$('shell');
    if(shell&&shell.classList.contains('shell-max')&&$('shell-maximize')) $('shell-maximize').click();
    var panel=t.closest('.shell-panel');
    if(panel&&panel.classList.contains('collapsed')){ var h=panel.querySelector('.shell-panel-head'); if(h) h.click(); }
    if(!t.offsetParent){
      var tt=$('phys-toast');
      if(tt){ tt.innerHTML=miss||'That control is not showing yet. The Guided Inquiry reveals it later, and it is always visible in Free Exploration.'; tt.classList.add('show'); setTimeout(function(){tt.classList.remove('show');},4200); }
      return;
    }
    t.scrollIntoView({block:'nearest',behavior:'smooth'});
    t.classList.remove('ps-spot'); void t.offsetWidth; t.classList.add('ps-spot');
    setTimeout(function(){ t.classList.remove('ps-spot'); },3400);
    var f=t.matches('input,button,select')?t:t.querySelector('input,button,select'); if(f) setTimeout(function(){ try{f.focus({preventScroll:true});}catch(e){} },80);
  }
  Array.prototype.forEach.call(art.querySelectorAll('.ps-loc'),function(b){
    var row=b.closest('tr'), name=row?row.querySelector('td b'):null;
    b.setAttribute('aria-label','Show '+(name?name.textContent:'this control')+' in the sim');
    b.addEventListener('click',function(){
      var sel=b.getAttribute('data-locate'), prep=b.getAttribute('data-locate-prep');
      toWatch=true; $('phys-close').click();
      /* data-locate-prep="#modeBtn": click this first, for a control that only exists in another mode or view */
      if(prep){ var pe=document.querySelector(prep); if(pe&&!(sel&&document.querySelector(sel)&&document.querySelector(sel).offsetParent)) pe.click(); }
      setTimeout(function(){ spot(sel,b.getAttribute('data-locate-miss')); },prep?200:60);
    });
  });
})();
</script>
